<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF0055"/>
      <stop offset="1" stop-color="#FF3377"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle card background pattern -->
  <g opacity="0.05" fill="#FF0055">
    <text x="150" y="130" font-family="sans-serif" font-size="40" font-weight="800">♥</text>
    <text x="1030" y="520" font-family="sans-serif" font-size="40" font-weight="800">♥</text>
  </g>

  <!-- Ace of Hearts card -->
  <g transform="translate(128, 148)">
    <rect x="0" y="0" width="180" height="252" rx="20" fill="#FFFFFF" stroke="url(#accent)" stroke-width="10"/>
    <text x="22" y="48" font-family="sans-serif" font-size="36" font-weight="800" fill="#FF0055">A</text>
    <text x="158" y="232" font-family="sans-serif" font-size="36" font-weight="800" fill="#FF0055" text-anchor="end" transform="rotate(180 158 232)">A</text>
    <text x="90" y="172" font-family="sans-serif" font-size="96" font-weight="800" fill="#FF0055" text-anchor="middle">♥</text>
  </g>

  <!-- Text -->
  <text x="382" y="230" font-family="sans-serif" font-size="96" font-weight="800" fill="#FFFFFF">Planning Poker</text>
  <text x="384" y="340" font-family="sans-serif" font-size="30" font-weight="500" fill="#94a3b8">Agile story point estimation for your team —</text>
  <text x="384" y="388" font-family="sans-serif" font-size="30" font-weight="500" fill="#94a3b8">voting, reveals, and history in one free room.</text>

  <!-- card stack hint on the right -->
  <g transform="translate(948, 330)">
    <rect x="0" y="0" width="124" height="174" rx="14" fill="none" stroke="#1e293b" stroke-width="6"/>
    <text x="22" y="52" font-family="sans-serif" font-size="28" font-weight="800" fill="#475569">?</text>
    <text x="62" y="130" font-family="sans-serif" font-size="56" font-weight="800" fill="#475569" text-anchor="middle">☕</text>
  </g>
</svg>
